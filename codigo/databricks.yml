bundle:
  name: databricks-telco-churn-lakehouse
  databricks_cli_version: ">=0.230.0"

include:
  - resources/*.yml

sync:
  exclude:
    - src/medallion_pipeline/utilities/context/**
    - src/medallion_pipeline/utilities/events/**
    - src/medallion_pipeline/utilities/source_buffer/**
    - src/medallion_pipeline/utilities/generate_full.log
    - data_generator/**
  include:
    - notebooks/**

variables:
  uc_catalog:
    description: Unity Catalog catalog where the pipeline publishes tables
    default: workspace
  uc_schema:
    description: Isolated schema for the selected target
    default: telco_churn_development
  landing_volume_path:
    description: Volume root path with generated synthetic input data
    default: /Volumes/workspace/telco_churn_development/landing_zone
  pipeline_development:
    description: Enables Databricks pipeline development mode
    default: true

targets:
  development:
    mode: development
    default: true
    workspace:
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      uc_catalog: workspace
      uc_schema: telco_churn_development
      landing_volume_path: /Volumes/workspace/telco_churn_development/landing_zone
      pipeline_development: true

  staging-simulation:
    mode: production
    workspace:
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      uc_catalog: workspace
      uc_schema: telco_churn_staging_simulation
      landing_volume_path: /Volumes/workspace/telco_churn_staging_simulation/landing_zone
      pipeline_development: false
  production-simulation:
    mode: production
    workspace:
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      uc_catalog: workspace
      uc_schema: telco_churn_production_simulation
      landing_volume_path: /Volumes/workspace/telco_churn_production_simulation/landing_zone
      pipeline_development: false
